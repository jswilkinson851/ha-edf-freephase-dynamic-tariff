# ==============================================================================
# EDF FreePhase Dynamic — Phases Summary Dashboard
# ==============================================================================

type: vertical-stack
cards:

  ###############################################################
  # Yesterday's Phases
  ###############################################################
  - type: custom:expander-card
    title: Yesterday's Phases
    padding: 0
    cards:
      - type: custom:mushroom-template-card
        multiline_secondary: true
        icon: >
          {% set p = state_attr('sensor.edf_fpd_yesterday_phases_summary',
          'phase_1') %} {{ p['icon'] if p else 'mdi:help-circle' }}
        primary: >
          {% set p = state_attr('sensor.edf_fpd_yesterday_phases_summary',
          'phase_1') %} Phase 1 — {{ p['phase'] | title if p else 'No data yet'
          }}
        secondary: >
          {% set p = state_attr('sensor.edf_fpd_yesterday_phases_summary',
          'phase_1') %} {{ p['start'] if p else '—' }} → {{ p['end'] if p else
          '—' }} • {{ p['price_pen_per_kwh'] if p else '—' }}
        color: >
          {% set p = state_attr('sensor.edf_fpd_yesterday_phases_summary',
          'phase_1') %} {{ p['phase'] if p else 'grey' }}
        features_position: bottom
      - type: custom:mushroom-template-card
        multiline_secondary: true
        icon: >
          {% set p = state_attr('sensor.edf_fpd_yesterday_phases_summary',
          'phase_2') %} {{ p['icon'] if p else 'mdi:help-circle' }}
